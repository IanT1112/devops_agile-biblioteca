services:
  backend:
    build: ./backend
    container_name: biblioteca_backend
    ports:
      - "3001:3001"


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: biblioteca_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend